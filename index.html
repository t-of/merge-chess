<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f2a">
  <meta name="description" content="中央のマスがところどころ長方形につながった盤で遊ぶ、2人対戦のチェス">
  <title>merge-chess — マスがつながるチェス</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="merge-chess">
  <meta property="og:title" content="merge-chess — マスがつながるチェス">
  <meta property="og:description" content="中央のマスがところどころ長方形につながった盤で遊ぶ、2人対戦のチェス">
  <meta property="og:url" content="https://t-of.github.io/merge-chess/">
  <meta property="og:image" content="https://t-of.github.io/merge-chess/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="merge-chess">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">merge-chess</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="boardwrap"><div class="board" id="board"></div></div>
      <div class="promo" id="promo" hidden></div>
      <div class="result" id="result" hidden></div>
      <div class="controls">
        <button class="pill" id="btn-new">新しい対局</button>
        <button class="pill" id="btn-undo">1手戻す</button>
        <button class="pill" id="btn-flip">盤を反転</button>
        <button class="pill" id="btn-sound" aria-pressed="true">音：入</button>
      </div>
      <form class="seedrow" id="seedform">
        <span>シード: <b id="seed"></b></span>
        <input id="seedin" type="number" inputmode="numeric" min="0" max="999999" placeholder="番号" aria-label="シード番号">
        <button class="pill" type="submit">この地形で開始</button>
      </form>
      <div class="moves" id="moves"></div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a> ・ <span class="ver">v1</span>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./logic.js"></script>
  <script src="./main.js"></script>
</body>
</html>
